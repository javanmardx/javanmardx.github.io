<header class="site-header">
  <link href="https://cdn.jsdelivr.net/gh/rastikerdar/vazirmatn@v33.003/Vazirmatn-font-face.css" rel="stylesheet" type="text/css" />
  <link rel="stylesheet" href="{{ '/assets/css/custom.css' | relative_url }}">
  <link rel="icon" type="image/png" href="{{ '/favicon.png' | relative_url }}">


  <div class="wrapper">
    <a class="site-title" rel="author" href="{{ '/' | relative_url }}">
      {{ site.title | default: "گاه‌نوشت‌های یک زریر" }}
    </a>

    <!-- منوی آیکونی -->
    <nav class="site-nav" style="display: flex; justify-content: center; align-items: center; gap: 20px; margin-bottom: 20px;">
      
      <!-- خانه -->
      <a class="page-link" href="{{ '/' | relative_url }}" title="خانه">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
      </a>

      <!-- بایگانی -->
      <a class="page-link" href="{{ '/all-posts/' | relative_url }}" title="بایگانی">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10h18M3 14h18M3 18h18M3 6h18"/></svg>
      </a>

      <!-- تماس -->
      <a class="page-link" href="{{ '/contact/' | relative_url }}" title="تماس">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect width="20" height="16" x="2" y="4" rx="2"/><path d="m22 7-8.97 5.7a1.94 1.94 0 0 1-2.06 0L2 7"/></svg>
      </a>

      <!-- دکمه جستجو (ذره‌بین) -->
      <a href="javascript:void(0)" id="search-toggle" title="جستجو">
        <svg xmlns="http://www.w3.org/2000/svg" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
      </a>

    </nav>

    <!-- باکس جستجو (در ابتدا مخفی) -->
    <div id="search-wrapper" style="display: none; text-align: center; margin-bottom: 20px; animation: fadeIn 0.3s; direction: rtl;">
        <input type="text" id="search-input" placeholder="جستجو در نوشته‌ها..." style="width: 80%; padding: 10px; border-radius: 25px; border: 1px solid #ddd; outline: none; font-family: 'Vazirmatn';">
        <ul id="results-container" style="list-style: none; padding: 0; max-width: 80%; margin: 10px auto; text-align: right;"></ul>
    </div>

    <!-- اسکریپت‌ها -->
    <script src="{{ '/assets/js/simple-jekyll-search.min.js' | relative_url }}"></script>
    <script>
      // تنظیمات جستجو
      SimpleJekyllSearch({
        searchInput: document.getElementById('search-input'),
        resultsContainer: document.getElementById('results-container'),
        json: "{{ '/search.json' | relative_url }}",
        searchResultTemplate: '<li><a href="{url}" style="color: #2a7ae2; text-decoration: none; font-size: 1.1rem;">{title}</a> <small style="color: #999;">({date})</small></li>',
        noResultsText: 'نتیجه‌ای یافت نشد',
        limit: 10,
        fuzzy: false
      });

      // منطق نمایش/مخفی‌سازی
      const searchToggle = document.getElementById('search-toggle');
      const searchWrapper = document.getElementById('search-wrapper');
      const searchInput = document.getElementById('search-input');

      searchToggle.onclick = function(e) {
        e.preventDefault();
        if (searchWrapper.style.display === 'none') {
          searchWrapper.style.display = 'block';
          searchInput.focus();
        } else {
          searchWrapper.style.display = 'none';
        }
      };
    </script>

    <style>
      @keyframes fadeIn {
        from { opacity: 0; transform: translateY(-10px); }
        to { opacity: 1; transform: translateY(0); }
      }
      .page-link svg, #search-toggle svg {
        color: #555;
        transition: color 0.3s;
        vertical-align: middle;
      }
      .page-link:hover svg, #search-toggle:hover svg {
        color: #2a7ae2;
      }
      #results-container li {
        margin-bottom: 5px;
        border-bottom: 1px solid #eee;
        padding-bottom: 5px;
      }
    </style>
  </div>
</header>
